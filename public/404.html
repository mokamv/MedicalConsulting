<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4c7170">
    <meta name="robots" content="noindex">
    <title>Siden finnes ikke – Bærum Lungeklinikk</title>

    <link rel="stylesheet" href="/css/shared.css">
    <link rel="icon" type="image/png" href="/media/logo.png">

    <style>
      .notfound {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .notfound-card {
        background: var(--card);
        max-width: 560px;
        width: 100%;
        padding: 3rem 2rem;
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        text-align: center;
      }

      .notfound-card .notfound-code {
        margin: 0;
        font-size: 5rem;
        line-height: 1;
        font-weight: 500;
        letter-spacing: -2px;
        color: var(--primary);
      }

      .notfound-card h1 {
        margin: 0.75rem 0 1rem;
        font-size: 1.8rem;
        font-weight: 500;
        color: var(--primary);
      }

      .notfound-card p {
        margin: 0 0 2rem;
        line-height: 1.7;
        color: var(--text-body);
      }

      .notfound-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      .btn-outline {
        background: transparent;
        color: var(--primary);
        box-shadow: inset 0 0 0 2px var(--primary);
      }

      .btn-outline:hover {
        background: var(--primary-tint);
        color: var(--primary-dark);
        box-shadow: inset 0 0 0 2px var(--primary);
      }

      @media screen and (max-width: 740px) {
        .notfound-card { padding: 2rem 1.25rem; }
        .notfound-code { font-size: 4rem; }
        .notfound-card h1 { font-size: 1.5rem; }
        .notfound-actions .btn { flex: 1 1 100%; }
      }
    </style>
  </head>
  <body>
    <script src="/js/components.js"></script>
    <main class="notfound">
      <div class="notfound-card">
        <p class="notfound-code">404</p>
        <h1>Siden finnes ikke</h1>
        <p>Beklager, vi fant ikke siden du lette etter. Den kan ha blitt flyttet eller slettet, eller adressen kan være skrevet feil.</p>
        <div class="notfound-actions">
          <a class="btn" href="/index.html">Til forsiden</a>
          <a class="btn btn-outline" href="/contact.html">Kontakt oss</a>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
